backend:
  name: git-gateway
  branch: main

media_folder: public/images
public_folder: /images

locale: nl

collections:
  - name: projecten
    label: Projecten
    folder: src/content/projecten
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: title
    fields:
      - { label: Titel, name: title, widget: string }
      - { label: Slug, name: slug, widget: string, hint: "URL-vriendelijke naam, bijv. router-slee" }
      - label: Categorie
        name: category
        widget: select
        options:
          - 3D Printen
          - CNC & Houtbewerking
          - Tabletop
      - { label: Beschrijving, name: description, widget: string }
      - { label: Datum, name: date, widget: datetime, format: YYYY-MM-DD, date_format: DD-MM-YYYY, time_format: false }
      - { label: Omslagfoto, name: image, widget: image, required: false, hint: "Wordt vierkant bijgesneden vanuit het midden" }
      - { label: Extra foto's, name: gallery, widget: list, required: false, field: { label: Foto, name: src, widget: image } }
      - { label: Machine, name: machine, widget: string, required: false, hint: "Vrije tekst, bijv. Makita RTC 0700 bovenfrees" }
      - { label: Gebruikte tools, name: tools, widget: relation, collection: tools, search_fields: [name], value_field: slug, display_fields: [name], multiple: true, required: false }
      - { label: Tags, name: tags, widget: list, default: [] }
      - { label: Inhoud, name: body, widget: markdown }

  - name: tools
    label: Tools
    folder: src/content/tools
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: name
    fields:
      - { label: Naam, name: name, widget: string }
      - { label: Slug, name: slug, widget: string, hint: "URL-vriendelijke naam, bijv. bambu-p1s" }
      - label: Categorie
        name: category
        widget: select
        options:
          - 3D Printen
          - CNC
          - Houtbewerking
          - Resin
      - { label: Beschrijving, name: description, widget: string }
      - { label: Volgorde, name: order, widget: number, required: false, value_type: int, hint: "Positie in de stuklijst (T-01, T-02, …)" }
      - { label: Foto, name: image, widget: image, required: false }
      - { label: Tags, name: tags, widget: list, default: [] }
      - { label: Inhoud, name: body, widget: markdown }
